# Application and spike runtimes.
[tools]
node = '24.21.0'
python = '3.14.7'
pnpm = '12.6.0'
uv = '0.12.10'

[env]
GUIDE_MODEL = '{{ get_env(name="GUIDE_MODEL", default="gpt-6-luna") }}'

[tasks.dev]
run = 'pnpm dev'

[tasks.'spikes:dev']
run = 'pnpm --dir spikes/web dev'

[tasks.deploy]
run = 'node deploy.js all'

[tasks.'deploy:setup']
run = 'node deploy.js setup'

[tasks.'deploy:rollback']
run = 'node deploy.js rollback'
