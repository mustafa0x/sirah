[tools]
node = '24.21.0'
python = '3.14.7'
pnpm = '12.6.0'
uv = '0.12.10'

[env]
GUIDE_MODEL = '{{ get_env(name="GUIDE_MODEL", default="gpt-6-luna") }}'
API_PORT = '8027'

[tasks.dev]
run = 'pnpm dev'

[tasks.'dev:api']
run = 'uv run api.py'

[tasks.'dev:all']
depends = ['dev', 'dev:api']

[tasks.'spikes:dev']
run = 'pnpm --dir spikes/web dev'

[tasks.deploy]
run = 'node deploy.js all'

[tasks.'deploy:setup']
run = 'node deploy.js setup'
