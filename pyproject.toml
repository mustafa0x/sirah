[project]
name = "sirah-journey-api"
version = "0.1.0"
description = "Server-side source boundary for the first playable Sirah Journey"
requires-python = ">=3.14"
dependencies = [
    "mcp>=1.30,<2",
    "openai>=2.0,<3",
    "polib>=1.2,<2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
